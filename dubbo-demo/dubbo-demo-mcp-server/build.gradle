description = 'The dubbo-parent module of dubbo project'

// MCP Demo需要Java 17+ (依赖dubbo-mcp模块)
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
}

configurations {
    // 使用 Log4j2 作为日志实现，排除 Spring Boot 默认的 Logback
    all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    all*.exclude group: 'ch.qos.logback'
}

dependencies {
    api project(':dubbo-registry:dubbo-registry-zookeeper')
    api project(':dubbo-rpc:dubbo-rpc-triple')
    api project(':dubbo-plugin:dubbo-triple-servlet')
    api project(':dubbo-plugin:dubbo-rest-openapi')
    api project(':dubbo-serialization:dubbo-serialization-hessian2')
    api project(':dubbo-remoting:dubbo-remoting-netty4')
    api project(':dubbo-plugin:dubbo-mcp')
    api project(':dubbo-config:dubbo-config-spring')
    api project(':dubbo-spring-boot-project:dubbo-spring-boot-autoconfigure')
    implementation "org.springframework.boot:spring-boot-starter-log4j2:${springBootStarterLog4j2Version}"
    implementation "org.springframework.boot:spring-boot-starter:${springBootStarterVersion}"
    compileOnly "com.github.therapi:therapi-runtime-javadoc-scribe:${therapiRuntimeJavadocScribeVersion}"
}
