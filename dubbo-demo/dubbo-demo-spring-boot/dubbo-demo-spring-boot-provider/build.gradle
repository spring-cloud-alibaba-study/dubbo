description = 'The dubbo-demo-spring-boot module of dubbo project'

configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
}

dependencies {
    implementation project(':dubbo-demo:dubbo-demo-spring-boot:dubbo-demo-spring-boot-interface')
    implementation project(':dubbo-registry:dubbo-registry-zookeeper')
    implementation project(':dubbo-configcenter:dubbo-configcenter-zookeeper')
    implementation project(':dubbo-metadata:dubbo-metadata-report-zookeeper')
    implementation project(':dubbo-config:dubbo-config-spring')
    implementation project(':dubbo-spring-boot-project:dubbo-spring-boot-starters:dubbo-tracing-otel-zipkin-spring-boot-starter')
    implementation project(':dubbo-plugin:dubbo-qos')
    implementation project(':dubbo-spring-boot-project:dubbo-spring-boot-starters:dubbo-spring-boot-starter')
    implementation "org.springframework.boot:spring-boot-starter:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-log4j2:${springBootVersion}"
}
