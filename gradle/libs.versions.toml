[bundles]
# ========================================
# Common Bundles (Frequently Used Together)
# ========================================
spring-core = ["spring-core", "spring-beans", "spring-context"]
spring-web = ["spring-core", "spring-beans", "spring-context", "spring-web"]
spring6-core = ["spring6-core", "spring6-beans", "spring6-context"]
testing = ["junit-jupiter-engine", "junit-jupiter-api", "junit-jupiter-params", "mockito-core", "mockito-inline", "awaitility", "hamcrest"]
grpc = ["grpc-core", "grpc-netty", "grpc-protobuf", "grpc-stub"]
curator = ["curator-framework", "curator-recipes"]
netty = ["netty-all", "netty-codecHttp2", "netty-handler"]
logging = ["slf4j-api", "log4j-api", "log4j-core"]

[plugins]
