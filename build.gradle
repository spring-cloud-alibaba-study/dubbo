release {
    // Version file configuration
    versionPropertyFile = 'gradle.properties'
    versionProperties = ['version']

    // Pre-release checks
    failOnCommitNeeded = true          // Must commit all changes
    failOnPublishNeeded = true         // Must publish to repository
    failOnSnapshotDependencies = true  // SNAPSHOT dependencies not allowed
    failOnUnversionedFiles = true      // Unversioned files not allowed
    failOnUpdateNeeded = true          // Must sync with remote
    revertOnFail = true                // Rollback on failure

    // Commit message templates
    preCommitText = ''
    preTagCommitMessage = '[Gradle Release] - pre tag commit: '
    tagCommitMessage = '[Gradle Release] - creating tag: '
    newVersionCommitMessage = '[Gradle Release] - new version commit: '

    // Tag template
    tagTemplate = 'v${version}'

    // Build tasks
    buildTasks = ['build']

    // Git configuration (compatible with release plugin 2.8.1 for Gradle 6.5+)
    git {
        // requireBranch = 'maven_to_gradle'  // No branch restriction for release (commented out)
        pushToRemote = 'origin'                // Push to remote
        signTag = false                        // Don't sign tags
    }
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    def isPlatformProject = project.name.contains('bom') ||
                           project.name.contains('dependencies-all') ||
                           project.path.contains(':dubbo-distribution:dubbo-bom')

    if (!isPlatformProject) {
        apply plugin: 'java-library'

        // ========================================
        // Unified dependency version management - Import BOM
        // ========================================
        dependencies {
            api enforcedPlatform(project(':dubbo-dependencies-bom'))
        }

        // ========================================
        // Unified logging configuration
        // ========================================
        configurations.all {
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        }

        // Java configuration
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
            withSourcesJar()
            withJavadocJar()
        }

        // ========================================
        // Package LICENSE and NOTICE files to META-INF/
        // Package .artifacts version file to META-INF/dubbo-versions/
        // ========================================
        tasks.withType(ProcessResources).configureEach {
            // Use WARN strategy to keep first occurrence when duplicates are found
            duplicatesStrategy = DuplicatesStrategy.WARN

            // Copy LICENSE to META-INF/
            from(rootProject.file('LICENSE')) {
                into 'META-INF'
            }

            // Copy NOTICE to META-INF/
            from(rootProject.file('NOTICE')) {
                into 'META-INF'
            }

            // Copy .artifacts to META-INF/dubbo-versions/
            from(rootProject.file('.artifacts')) {
                into 'META-INF/dubbo-versions'
            }
        }

        // Encoding
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-parameters', '-proc:none']
        }

        // Test configuration
        test {
            useJUnitPlatform()
            maxHeapSize = '512m'
            jvmArgs = [
                '-server',
                '-Xms256m',
                '-Xmx512m',
                '-XX:MetaspaceSize=64m',
                '-XX:MaxMetaspaceSize=128m',
                '-Dfile.encoding=UTF-8',
                '-Djava.net.preferIPv4Stack=true'
            ]

            // Add JDK 15+ compatibility
            if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_15)) {
                jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.math=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED'
                ]
            }
        }

        // Common dependencies for all subprojects
        dependencies {
            testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
            testImplementation "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
            testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
            testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
            testImplementation "org.mockito:mockito-core:${mockitoVersion}"
            testImplementation "org.mockito:mockito-inline:${mockitoVersion}"
        }
    }

    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // Configure resources and Jar only for non-platform projects
    if (!isPlatformProject) {
        // Resources configuration - copy LICENSE and NOTICE to each jar
        processResources {
            from(rootDir) {
                include 'NOTICE'
                include 'LICENSE'
                into 'META-INF'
            }

            // Add version info
            doLast {
                def versionFile = file("${buildDir}/resources/main/META-INF/dubbo-versions/${project.name}")
                versionFile.parentFile.mkdirs()
                versionFile.text = """revision=${version}
artifact.id=${project.name}
git.commit.id=${getGitCommitId()}
"""
            }
        }

        // Jar configuration
        jar {
            manifest {
                attributes(
                    'Specification-Version': version,
                    'Implementation-Version': version,
                    'Specification-Title': project.name,
                    'Implementation-Title': project.name,
                    'Specification-Vendor': 'The Apache Software Foundation',
                    'Implementation-Vendor': 'The Apache Software Foundation'
                )
            }
        }

        // Javadoc configuration
        javadoc {
            options.encoding = 'UTF-8'
            options.charSet = 'UTF-8'
            options.docEncoding = 'UTF-8'
            options.addStringOption('Xdoclint:none', '-quiet')
            if (JavaVersion.current().isJava9Compatible()) {
                options.addBooleanOption('html5', true)
            }

            // Exclude demo packages
            exclude '**/org/apache/dubbo/demo/**'
        }
    }

    // Publishing configuration - Use afterEvaluate to ensure components are created
    afterEvaluate {
        if (components.findByName('java') || components.findByName('javaPlatform')) {
            // Suppress validation errors for enforced-platform dependencies
            tasks.withType(GenerateModuleMetadata).configureEach {
                suppressedValidationErrors.add('enforced-platform')
            }

            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        if (isPlatformProject && components.findByName('javaPlatform')) {
                            from components.javaPlatform
                        } else if (components.findByName('java')) {
                            from components.java
                        }

                        pom {
                            name = project.name
                            description = "The ${project.name} module of Apache Dubbo project"
                            url = 'https://github.com/apache/dubbo'
                            inceptionYear = '2011'

                            organization {
                                name = 'The Apache Software Foundation'
                                url = 'http://www.apache.org/'
                            }

                            licenses {
                                license {
                                    name = 'Apache License, Version 2.0'
                                    url = 'http://www.apache.org/licenses/LICENSE-2.0'
                                    distribution = 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id = 'dubbo.io'
                                    name = 'The Dubbo Project Contributors'
                                    email = 'dev-subscribe@dubbo.apache.org'
                                    url = 'http://dubbo.apache.org/'
                                }
                            }

                            scm {
                                connection = 'scm:git:https://github.com/apache/dubbo.git'
                                developerConnection = 'scm:git:https://github.com/apache/dubbo.git'
                                url = 'https://github.com/apache/dubbo'
                                tag = 'HEAD'
                            }

                            issueManagement {
                                system = 'Github Issues'
                                url = 'https://github.com/apache/dubbo/issues'
                            }
                        }
                    }
                }

                repositories {
                    maven {
                        def releasesRepoUrl = "https://repository.apache.org/service/local/staging/deploy/maven2"
                        def snapshotsRepoUrl = "https://repository.apache.org/content/repositories/snapshots"
                        url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                        credentials {
                            username = project.hasProperty('mavenCentralUsername') ? mavenCentralUsername : ''
                            password = project.hasProperty('mavenCentralPassword') ? mavenCentralPassword : ''
                        }
                    }
                }
            }

            // Signing configuration
            // Only configure signing if all required properties are present
            def hasSigningKey = project.hasProperty('signing.keyId') &&
                               project.hasProperty('signing.password') &&
                               (project.hasProperty('signing.secretKeyRingFile') || project.hasProperty('signing.key'))
            if (hasSigningKey) {
                signing {
                    // Required for all publish tasks to remote repositories (Maven Central, etc.)
                    // Not required for publishToMavenLocal (local development)
                    required { gradle.taskGraph.hasTask('publish') }
                    sign publishing.publications.mavenJava
                }
            }
        }
    }
}

// Helper function to get git commit ID
def getGitCommitId() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

// Wrapper configuration
// Note: Using Gradle 7.4 for Java 17 compatibility (minimum version that fully supports Java 17)
// Gradle 7.4+ is required when using Java 17
wrapper {
    gradleVersion = '7.4'
    distributionType = Wrapper.DistributionType.BIN
}

