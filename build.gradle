allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    // 跳过 BOM 和 platform 项目，它们使用 java-platform 插件
    def isPlatformProject = project.name.contains('bom') ||
                           project.name.contains('dependencies-all') ||
                           project.path.contains(':dubbo-distribution:dubbo-bom')

    if (!isPlatformProject) {
        apply plugin: 'java-library'

        // ========================================
        // 统一日志管理配置
        // ========================================
        configurations.all {
            // 1. 解决 Log4j 循环依赖问题
            // log4j-slf4j-impl (SLF4J -> Log4j2) 与 log4j-to-slf4j (Log4j2 -> SLF4J)
            // 不能同时存在，会造成循环依赖
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        }

        // Java configuration
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
            withSourcesJar()
            withJavadocJar()
        }

        // Encoding
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-parameters', '-proc:none']
        }

        // Test configuration
        test {
            useJUnitPlatform()
            maxHeapSize = '512m'
            jvmArgs = [
                '-server',
                '-Xms256m',
                '-Xmx512m',
                '-XX:MetaspaceSize=64m',
                '-XX:MaxMetaspaceSize=128m',
                '-Dfile.encoding=UTF-8',
                '-Djava.net.preferIPv4Stack=true'
            ]

            // Add JDK 15+ compatibility
            if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_15)) {
                jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.math=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED'
                ]
            }
        }

        // Common dependencies for all subprojects
        dependencies {
            testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
            testImplementation "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
            testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
            testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
            testImplementation "org.mockito:mockito-core:${mockitoVersion}"
            testImplementation "org.mockito:mockito-inline:${mockitoVersion}"
        }
    }

    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // 仅为非 platform 项目配置资源和 Jar
    if (!isPlatformProject) {
        // Resources configuration - copy LICENSE and NOTICE to each jar
        processResources {
            from(rootDir) {
                include 'NOTICE'
                include 'LICENSE'
                into 'META-INF'
            }

            // Add version info
            doLast {
                def versionFile = file("${buildDir}/resources/main/META-INF/dubbo-versions/${project.name}")
                versionFile.parentFile.mkdirs()
                versionFile.text = """revision=${version}
artifact.id=${project.name}
git.commit.id=${getGitCommitId()}
"""
            }
        }

        // Jar configuration
        jar {
            manifest {
                attributes(
                    'Specification-Version': version,
                    'Implementation-Version': version,
                    'Specification-Title': project.name,
                    'Implementation-Title': project.name,
                    'Specification-Vendor': 'The Apache Software Foundation',
                    'Implementation-Vendor': 'The Apache Software Foundation'
                )
            }
        }

        // Javadoc configuration
        javadoc {
            options.encoding = 'UTF-8'
            options.charSet = 'UTF-8'
            options.docEncoding = 'UTF-8'
            options.addStringOption('Xdoclint:none', '-quiet')
            if (JavaVersion.current().isJava9Compatible()) {
                options.addBooleanOption('html5', true)
            }

            // Exclude demo packages
            exclude '**/org/apache/dubbo/demo/**'
        }
    }

    // Publishing configuration - 使用 afterEvaluate 确保组件已创建
    afterEvaluate {
        if (components.findByName('java') || components.findByName('javaPlatform')) {
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        if (isPlatformProject && components.findByName('javaPlatform')) {
                            from components.javaPlatform
                        } else if (components.findByName('java')) {
                            from components.java
                        }

                        pom {
                            name = project.name
                            description = "The ${project.name} module of Apache Dubbo project"
                            url = 'https://github.com/apache/dubbo'
                            inceptionYear = '2011'

                            organization {
                                name = 'The Apache Software Foundation'
                                url = 'http://www.apache.org/'
                            }

                            licenses {
                                license {
                                    name = 'Apache License, Version 2.0'
                                    url = 'http://www.apache.org/licenses/LICENSE-2.0'
                                    distribution = 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id = 'dubbo.io'
                                    name = 'The Dubbo Project Contributors'
                                    email = 'dev-subscribe@dubbo.apache.org'
                                    url = 'http://dubbo.apache.org/'
                                }
                            }

                            scm {
                                connection = 'scm:git:https://github.com/apache/dubbo.git'
                                developerConnection = 'scm:git:https://github.com/apache/dubbo.git'
                                url = 'https://github.com/apache/dubbo'
                                tag = 'HEAD'
                            }

                            issueManagement {
                                system = 'Github Issues'
                                url = 'https://github.com/apache/dubbo/issues'
                            }
                        }
                    }
                }

                repositories {
                    maven {
                        def releasesRepoUrl = "https://repository.apache.org/service/local/staging/deploy/maven2"
                        def snapshotsRepoUrl = "https://repository.apache.org/content/repositories/snapshots"
                        url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                        credentials {
                            username = project.hasProperty('mavenCentralUsername') ? mavenCentralUsername : ''
                            password = project.hasProperty('mavenCentralPassword') ? mavenCentralPassword : ''
                        }
                    }
                }
            }

            // Signing configuration
            signing {
                required { gradle.taskGraph.hasTask('publish') && !version.endsWith('SNAPSHOT') }
                sign publishing.publications.mavenJava
            }
        }
    }
}

// Helper function to get git commit ID
def getGitCommitId() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

// Wrapper configuration
wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.BIN
}

