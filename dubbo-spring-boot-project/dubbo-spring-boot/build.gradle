description = 'Apache Dubbo Spring Boot'

dependencies {
    // api project(':dubbo') // Module does not exist, commented out
    compileOnly project(':dubbo-common')
    compileOnly project(':dubbo-rpc:dubbo-rpc-triple')
    compileOnly libs.springBootStarterWeb
    compileOnly project(':dubbo-rpc:dubbo-rpc-api')
    compileOnly project(':dubbo-config:dubbo-config-spring')
    testImplementation libs.springBootStarterTest
    testImplementation libs.byteBuddy
    testImplementation libs.byteBuddyAgent
    testImplementation project(':dubbo-test:dubbo-test-check')
    testImplementation libs.log4jSlf4jImpl
}
