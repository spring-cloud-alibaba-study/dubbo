description = 'Apache Dubbo Spring Boot Actuator'

dependencies {
    compileOnly libs.springBootStarterWeb
    compileOnly libs.springBootStarterActuator
    api project(':dubbo-spring-boot-project:dubbo-spring-boot')
    // api project(':dubbo') // Module does not exist, commented out
    compileOnly project(':dubbo-common')
    compileOnly project(':dubbo-config:dubbo-config-spring')
    compileOnly project(':dubbo-remoting:dubbo-remoting-netty4')
    compileOnly project(':dubbo-serialization:dubbo-serialization-hessian2')
    compileOnly project(':dubbo-serialization:dubbo-serialization-fastjson2')
    compileOnly project(':dubbo-rpc:dubbo-rpc-dubbo')
    compileOnly project(':dubbo-plugin:dubbo-qos')
    testImplementation libs.springBootStarterTest
    testImplementation libs.junitPlatformRunner
    api project(':dubbo-metrics:dubbo-metrics-default')
}
