description = 'Apache Dubbo Spring Boot Compatible for Spring Boot 1.x Auto-Configure'

// 使用 Spring Boot 1.x 版本以支持 RelaxedPropertyResolver 等 API
ext {
    springBoot1Version = '1.5.22.RELEASE'
}

dependencies {
    compileOnly "org.springframework.boot:spring-boot-autoconfigure:${springBoot1Version}"
    compileOnly "org.springframework.boot:spring-boot:${springBoot1Version}"
    compileOnly "org.springframework.boot:spring-boot-starter-log4j2:${springBoot1Version}"
    compileOnly project(':dubbo-common')
    compileOnly project(':dubbo-config:dubbo-config-spring')
    // api project(':dubbo') // 模块不存在，已注释
    api project(':dubbo-spring-boot-project:dubbo-spring-boot')
    compileOnly "javax.websocket:javax.websocket-api:${javaxWebsocketApiVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootStarterTestVersion}"
}
