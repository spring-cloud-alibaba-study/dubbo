description = 'Apache Dubbo Spring Boot Actuator Autoconfigure'

dependencies {
    compileOnly libs.springBootStarterWeb
    compileOnly libs.tomcatEmbedCore
    api project(':dubbo-spring-boot-project:dubbo-spring-boot-actuator')
    compileOnly libs.springBootActuatorAutoconfigure
    api project(':dubbo-spring-boot-project:dubbo-spring-boot-autoconfigure')
    compileOnly libs.springBootConfigurationProcessor
    // api project(':dubbo-spring-boot-project:dubbo-spring-boot-compatible:dubbo-spring-boot-actuator-autoconfigure-compatible')  // Temporarily disabled: Spring Boot 1.x is EOL
    // api project(':dubbo') // Module does not exist, commented out
    compileOnly project(':dubbo-common')
    compileOnly project(':dubbo-config:dubbo-config-spring')
    testImplementation project(':dubbo-rpc:dubbo-rpc-dubbo')
    compileOnly project(':dubbo-plugin:dubbo-qos')
    testImplementation libs.springBootStarterTest
    testImplementation libs.springBootStarterLog4j2
    testImplementation libs.byteBuddy
    testImplementation libs.byteBuddyAgent
    testImplementation project(':dubbo-test:dubbo-test-check')
    testImplementation libs.log4jSlf4jImpl
}
