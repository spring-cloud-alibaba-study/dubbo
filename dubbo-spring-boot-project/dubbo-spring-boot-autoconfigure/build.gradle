description = 'Apache Dubbo Spring Boot Auto-Configure'

dependencies {
    // Depends on dubbo-spring-boot module (contains utility classes like DubboUtils, DubboOpenAPIExportListener, etc.)
    api project(':dubbo-spring-boot-project:dubbo-spring-boot')
    api project(':dubbo-spring-boot-project:dubbo-spring-boot-compatible:dubbo-spring-boot-autoconfigure-compatible')
    compileOnly "org.springframework.boot:spring-boot-autoconfigure:${springBootAutoconfigureVersion}"
    compileOnly "org.springframework.boot:spring-boot-starter-log4j2:${springBootStarterLog4j2Version}"
    compileOnly "org.springframework.boot:spring-boot-configuration-processor:${springBootConfigurationProcessorVersion}"
    // api project(':dubbo') // Module does not exist, commented out
    compileOnly project(':dubbo-common')
    compileOnly project(':dubbo-plugin:dubbo-triple-servlet')
    compileOnly project(':dubbo-plugin:dubbo-triple-websocket')
    compileOnly "javax.servlet:javax.servlet-api"
    compileOnly "org.apache.tomcat.embed:tomcat-embed-core"
    compileOnly "jakarta.websocket:jakarta.websocket-api"
    compileOnly "jakarta.websocket:jakarta.websocket-client-api"
    compileOnly libs.micrometerTracing
    compileOnly libs.micrometerObservation
    compileOnly libs.micrometerCore
    compileOnly "io.micrometer:micrometer-registry-prometheus-simpleclient:${micrometerRegistryPrometheusSimpleclientVersion}"
    compileOnly libs.digest
    compileOnly libs.prometheusClient
    compileOnly libs.simpleclientPushgateway
    compileOnly "org.springframework:spring-webmvc"
    compileOnly "org.springframework:spring-webflux:${springWebfluxVersion}"
    compileOnly libs.micrometerTracingBridgeOtel
    compileOnly libs.micrometerTracingBridgeBrave
    compileOnly libs.opentelemetryExporterZipkin
    compileOnly libs.opentelemetryExporterOtlp
    compileOnly libs.zipkinReporterBrave
    compileOnly libs.zipkinSenderUrlconnection
    compileOnly project(':dubbo-plugin:dubbo-qos')
    compileOnly project(':dubbo-config:dubbo-config-spring')
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootStarterTestVersion}"
    testImplementation "net.bytebuddy:byte-buddy"
    testImplementation "net.bytebuddy:byte-buddy-agent"
    testImplementation project(':dubbo-test:dubbo-test-check')
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
}
