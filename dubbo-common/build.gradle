description = 'The common module of Dubbo project'

dependencies {
    // Logging - provided scope
    compileOnly libs.slf4jApi
    compileOnly libs.commonsLogging
    compileOnly libs.log4jOld
    compileOnly libs.log4jApi
    compileOnly libs.log4jCore

    // Core dependencies
    implementation libs.javassist
    implementation libs.fastjson2
    api libs.commonsIo
    implementation libs.javaxAnnotationApi

    // Optional JSON libraries
    compileOnly libs.fastjson
    compileOnly libs.gson
    compileOnly libs.jacksonCore
    compileOnly libs.jacksonDatabind
    compileOnly libs.jacksonDatatypeJsr310

    // Test dependencies
    testImplementation libs.cglibNodep
    testImplementation libs.log4jSlf4jImpl
    testImplementation libs.log4jCore
    testImplementation libs.protobufJava
    testImplementation libs.fastjson  // For Fastjson v1 tests
    testImplementation libs.fastjson2
    testImplementation libs.gson
}

