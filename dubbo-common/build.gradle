description = 'The common module of dubbo project'

dependencies {
    // Logging - provided scope
    compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "commons-logging:commons-logging:${jclVersion}"
    compileOnly "log4j:log4j:${log4jVersion}"
    compileOnly "org.apache.logging.log4j:log4j-api:${log4j2Version}"
    compileOnly "org.apache.logging.log4j:log4j-core:${log4j2Version}"

    // Core dependencies
    implementation "org.javassist:javassist:${javassistVersion}"
    implementation "com.alibaba.fastjson2:fastjson2:${fastjson2Version}"
    api "commons-io:commons-io:${commonsIoVersion}"
    implementation "javax.annotation:javax.annotation-api:${javaxAnnotationApiVersion}"

    // Optional JSON libraries
    compileOnly "com.alibaba:fastjson:${fastjsonVersion}"
    compileOnly "com.google.code.gson:gson:${gsonVersion}"
    compileOnly "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    compileOnly "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Test dependencies
    testImplementation "cglib:cglib-nodep:${cglibVersion}"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4j2Version}"
    testImplementation "org.apache.logging.log4j:log4j-core:${log4j2Version}"
    testImplementation "com.google.protobuf:protobuf-java:${protobufJavaVersion}"
    testImplementation "com.alibaba.fastjson2:fastjson2:${fastjson2Version}"
    testImplementation "com.google.code.gson:gson:${gsonVersion}"
}

