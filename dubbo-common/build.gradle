description = 'The common module of dubbo project'

dependencies {
    // Logging - provided scope
    compileOnly "org.slf4j:slf4j-api"
    compileOnly "commons-logging:commons-logging"
    compileOnly "log4j:log4j"
    compileOnly "org.apache.logging.log4j:log4j-api"
    compileOnly "org.apache.logging.log4j:log4j-core"

    // Core dependencies
    implementation libs.javassist
    implementation libs.fastjson2
    api libs.commonsIo
    implementation libs.javaxAnnotationApi

    // Optional JSON libraries
    compileOnly "com.alibaba:fastjson"
    compileOnly "com.google.code.gson:gson"
    compileOnly "com.fasterxml.jackson.core:jackson-core"
    compileOnly "com.fasterxml.jackson.core:jackson-databind"
    compileOnly "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    // Test dependencies
    testImplementation "cglib:cglib-nodep"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
    testImplementation "org.apache.logging.log4j:log4j-core"
    testImplementation "com.google.protobuf:protobuf-java"
    testImplementation "com.alibaba.fastjson2:fastjson2"
    testImplementation "com.google.code.gson:gson"
}

