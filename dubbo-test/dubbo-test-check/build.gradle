description = 'The dubbo-test module of dubbo project'

dependencies {
    api project(':dubbo-common')
    implementation "org.junit.platform:junit-platform-launcher"
    implementation "org.junit.platform:junit-platform-engine"
    implementation "org.apache.commons:commons-lang3"
    implementation "org.apache.zookeeper:zookeeper"
    implementation "org.apache.curator:curator-framework"
    implementation "org.apache.commons:commons-compress"
    implementation "org.apache.commons:commons-exec:${commonsExecVersion}"
    implementation "org.asynchttpclient:async-http-client:${asyncHttpClientVersion}"
}
