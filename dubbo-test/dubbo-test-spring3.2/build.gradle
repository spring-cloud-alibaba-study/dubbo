description = 'The Spring 3.2 compatibility test module of Dubbo project'

// ========================================
// This module is for Spring 3.2.x compatibility testing
// Spring 3.2.x was released in 2013 and is EOL (End of Life)
// This module forces Spring 3.2.x version for compatibility testing
// ========================================

// Test module should not be published to Maven repository
ext {
    spring3Version = libs.versions.spring3.get()
    skip_maven_deploy = true
}

dependencies {
    implementation(libs.spring3Core) {
        version { strictly spring3Version }
    }
}
