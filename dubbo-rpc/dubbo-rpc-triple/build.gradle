plugins {
    id 'com.google.protobuf' version '0.9.4'
}

description = 'The Triple RPC module of dubbo project'

dependencies {
    compileOnly "org.javassist:javassist"
    api project(':dubbo-rpc:dubbo-rpc-api')
    api project(':dubbo-remoting:dubbo-remoting-http12')
    
    compileOnly project(':dubbo-remoting:dubbo-remoting-http3')
    compileOnly project(':dubbo-remoting:dubbo-remoting-websocket')
    compileOnly project(':dubbo-remoting:dubbo-remoting-netty4')
    implementation project(':dubbo-plugin:dubbo-native')
    
    implementation "com.google.protobuf:protobuf-java"
    compileOnly "com.google.protobuf:protobuf-java-util"
    implementation "io.grpc:grpc-core"
    implementation "io.grpc:grpc-protobuf"
    implementation "io.grpc:grpc-stub"
    
    // 添加 javax.annotation 支持（Java 9+ 需要）
    compileOnly "javax.annotation:javax.annotation-api:${javaxAnnotationApiVersion}"
    
    compileOnly "io.grpc:grpc-netty"
    compileOnly "org.apache.commons:commons-compress"
    compileOnly "org.xerial.snappy:snappy-java"
    
    testImplementation "org.apache.groovy:groovy:${groovyVersion}"
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
    testImplementation "io.grpc:grpc-netty"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufProtocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
        dubbo {
            // 使用 dubbo-compiler 生成 Dubbo Triple 代码
            path = project(':dubbo-plugin:dubbo-compiler').tasks.jar.outputs.files.singleFile.absolutePath
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.dependsOn ':dubbo-plugin:dubbo-compiler:jar'
            task.plugins {
                grpc {}
                dubbo {
                    option 'dubbo'
                }
            }
        }
    }
    generatedFilesBaseDir = "$buildDir/generated/source/proto"
}

// 添加生成的源码目录
sourceSets {
    main {
        java {
            srcDirs += [
                "$buildDir/generated/source/proto/main/java",
                "$buildDir/generated/source/proto/main/grpc",
                "$buildDir/generated/source/proto/main/dubbo"
            ]
        }
    }
}

// 确保编译前先生成 protobuf 代码
tasks.named('compileJava') {
    dependsOn 'generateProto'
}

// 确保 sourcesJar 在 Protobuf 生成后执行
tasks.named('sourcesJar') {
    dependsOn 'generateProto'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

