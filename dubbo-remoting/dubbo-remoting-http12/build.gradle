description = 'The http1/2 remoting module of dubbo project'

dependencies {
    api project(':dubbo-rpc:dubbo-rpc-api')
    api project(':dubbo-common')
    api project(':dubbo-remoting:dubbo-remoting-api')
    api "io.netty:netty-transport"
    api "io.netty:netty-codec-http2"
    api "io.netty:netty-codec-http"
    compileOnly "com.google.protobuf:protobuf-java-util"
    compileOnly "javax.xml.bind:jaxb-api:${jaxbApiVersion}"
    compileOnly "org.glassfish.jaxb:jaxb-runtime:${jaxbRuntimeVersion}"
    compileOnly "org.yaml:snakeyaml:${snakeyamlVersion}"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
}
