/*
 * 这是一个模板文件，用于创建新的模块 build.gradle
 * 
 * 使用方法：
 * 1. 复制此文件到目标模块目录
 * 2. 重命名为 build.gradle
 * 3. 修改 description
 * 4. 根据模块的 pom.xml 添加相应的依赖
 */

description = 'The [MODULE_NAME] module of dubbo project'

dependencies {
    // API dependencies (公开给使用者的依赖)
    // api project(':dubbo-common')
    
    // Implementation dependencies (内部实现依赖)
    // implementation libs.springContext
    
    // Compile-only dependencies (编译时需要，运行时不需要)
    // compileOnly libs.servletApi
    
    // Runtime-only dependencies (运行时需要，编译时不需要)
    // runtimeOnly "mysql:mysql-connector-java"
    
    // Test dependencies (测试依赖)
    // testImplementation project(':dubbo-test:dubbo-test-common')
    // testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
    
    // Optional dependencies (可选依赖)
    // compileOnly libs.grpcCore
}

