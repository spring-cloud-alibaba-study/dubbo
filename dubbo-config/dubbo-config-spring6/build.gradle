description = 'The dubbo-config module of dubbo project'

// Spring 6 module requires Java 17+
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
}

dependencies {
    api project(':dubbo-config:dubbo-config-api')
    api project(':dubbo-config:dubbo-config-spring')
    
    // ========================================
    // Use Spring 6 dependencies (force override Spring 5 in BOM)
    // ========================================
    implementation("org.springframework:spring-beans") {
        version { strictly spring6Version }
    }
    implementation("org.springframework:spring-core") {
        version { strictly spring6Version }
    }
    implementation("org.springframework:spring-web") {
        version { strictly spring6Version }
    }
    implementation("org.springframework:spring-context") {
        version { strictly spring6Version }
    }
    
    // Spring 6 AOT functionality is integrated in spring-core and spring-context, no separate dependency needed
    compileOnly "jakarta.servlet:jakarta.servlet-api"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBoot3Version}"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"

    // Complete missing dependencies (support both javax and jakarta)
    compileOnly "javax.servlet:javax.servlet-api"
}

