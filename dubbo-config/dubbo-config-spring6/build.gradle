description = 'The Spring 6 configuration module of Dubbo project'

// Spring 6 module requires Java 17+
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.release = 17
}

// ========================================
// Module-specific version configuration
// Spring 6 version needs to strictly override Spring 5 in BOM
// ========================================
ext {
    spring6Version = libs.versions.spring6.get()
}

dependencies {
    api project(':dubbo-config:dubbo-config-api')
    api project(':dubbo-config:dubbo-config-spring')
    
    // ========================================
    // Use Spring 6 dependencies (force override Spring 5 in BOM)
    // All dependencies use libs.spring6Xxx from version catalog
    // ========================================
    implementation(libs.spring6Beans) {
        version { strictly spring6Version }
    }
    implementation(libs.spring6Core) {
        version { strictly spring6Version }
    }
    implementation(libs.spring6Web) {
        version { strictly spring6Version }
    }
    implementation(libs.spring6Context) {
        version { strictly spring6Version }
    }
    
    // Spring 6 uses Jakarta EE (not javax)
    compileOnly libs.jakartaServletApi
    
    // Test dependencies
    testImplementation libs.springBoot3StarterTest
    testImplementation libs.log4jSlf4jImpl
}

