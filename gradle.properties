# ========================================
# Project Metadata
# ========================================
version=3.3.6
group=org.apache.dubbo

# ========================================
# Build Settings
# ========================================
# Gradle JVM memory settings
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel build for faster compilation
org.gradle.parallel=true

# Enable build cache for incremental builds
org.gradle.caching=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Configure on demand (only configure relevant projects)
org.gradle.configureondemand=true

# Enable file system watching for better incremental build performance (Gradle 6.5+ experimental, 7.0+ stable)
# Note: This feature may be unstable in Gradle 6.5, comment out if you encounter issues
org.gradle.vfs.watch=true

# Use worker API for better parallelization (Gradle 6.0+)
org.gradle.workers.max=4

# ========================================
# Java Version
# ========================================
sourceCompatibility=1.8
targetCompatibility=1.8

# ========================================
# Publishing Credentials
# ========================================
# Note: Do not commit real credentials to version control
# Override these in ~/.gradle/gradle.properties or via environment variables
mavenCentralUsername=
mavenCentralPassword=
