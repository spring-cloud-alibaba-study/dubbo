# ========================================
# Project Metadata
# ========================================
version=3.3.7-SNAPSHOT
group=org.apache.dubbo

# ========================================
# Build Settings
# ========================================
# Gradle Daemon JVM settings (--add-opens required for JDK 15+)
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# Enable parallel build for faster compilation
org.gradle.parallel=true

# Enable build cache for incremental builds
org.gradle.caching=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Configure on demand (only configure relevant projects)
org.gradle.configureondemand=true

# Enable file system watching for better incremental build performance (Gradle 6.5+ experimental, 7.0+ stable)
# Note: This feature may be unstable in Gradle 6.5, comment out if you encounter issues
org.gradle.vfs.watch=true

# Use worker API for better parallelization (Gradle 6.0+)
org.gradle.workers.max=4

# ========================================
# Java Version
# ========================================
sourceCompatibility=1.8
targetCompatibility=1.8

# ========================================
# Publishing Configuration
# ========================================
# Skip maven deploy (equivalent to Maven's skip_maven_deploy property)
# Set to true to skip publishing to Maven repositories
# Can be overridden per module by adding ext.skip_maven_deploy = true in module's build.gradle
skip_maven_deploy=false

# ========================================
# Publishing Credentials
# ========================================
# Note: Do not commit real credentials to version control
# Override these in ~/.gradle/gradle.properties or via environment variables
mavenCentralUsername=
mavenCentralPassword=

# ========================================
# Java Toolchains Configuration (JDK 8-25)
# ========================================
# Auto-detect and auto-download JDK (supports any locally installed JDK version)
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
