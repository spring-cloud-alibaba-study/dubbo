description = 'The tracing module of dubbo project'

dependencies {
    api project(':dubbo-common')
    api project(':dubbo-cluster')
    api project(':dubbo-rpc:dubbo-rpc-api')
    api project(':dubbo-metrics:dubbo-metrics-default')
    implementation "io.micrometer:micrometer-core:${micrometerCoreVersion}"
    implementation "io.micrometer:micrometer-tracing:${micrometerTracingVersion}"
    
    // OpenTelemetry - 需要implementation才能编译通过
    implementation "io.micrometer:micrometer-tracing-bridge-otel:${micrometerTracingVersion}"
    implementation "io.micrometer:micrometer-tracing-bridge-brave:${micrometerTracingVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-zipkin:${opentelemetryVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${opentelemetryVersion}"
    implementation "io.zipkin.reporter2:zipkin-reporter-brave:${zipkinReporterVersion}"
    implementation "io.zipkin.reporter2:zipkin-sender-urlconnection:${zipkinReporterVersion}"
    implementation "io.zipkin.reporter2:zipkin-reporter:${zipkinReporterVersion}"
    
    // 测试依赖
    testImplementation "io.micrometer:micrometer-test:${micrometerVersion}"
    testImplementation "io.micrometer:micrometer-tracing-integration-test:${micrometerTracingVersion}"
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"
}
