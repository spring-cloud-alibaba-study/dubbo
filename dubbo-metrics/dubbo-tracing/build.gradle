description = 'The tracing module of Dubbo project'

dependencies {
    api project(':dubbo-common')
    api project(':dubbo-cluster')
    api project(':dubbo-rpc:dubbo-rpc-api')
    api project(':dubbo-metrics:dubbo-metrics-default')
    implementation libs.micrometerCore
    implementation libs.micrometerTracing
    
    // OpenTelemetry - needs implementation to compile
    implementation libs.micrometerTracingBridgeOtel
    implementation libs.micrometerTracingBridgeBrave
    implementation libs.opentelemetryExporterZipkin
    implementation libs.opentelemetryExporterOtlp
    implementation libs.zipkinReporterBrave
    implementation libs.zipkinSenderUrlconnection
    implementation libs.zipkinReporter
    
    // Test dependencies
    testImplementation libs.micrometerTest
    testImplementation libs.micrometerTracingIntegrationTest
    testImplementation libs.log4jSlf4jImpl
}
