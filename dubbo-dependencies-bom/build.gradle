plugins {
    id 'java-platform'
}

description = 'Dubbo dependencies BOM'

javaPlatform {
    allowDependencies()
}

dependencies {
    // Import platform BOMs
    api platform("org.springframework:spring-framework-bom:${springVersion}")
    api platform("org.springframework.security:spring-security-bom:${springSecurityVersion}")
    api platform("io.netty:netty-bom:${netty4Version}")
    api platform("io.micrometer:micrometer-bom:${micrometerVersion}")
    api platform("io.micrometer:micrometer-tracing-bom:${micrometerTracingVersion}")
    api platform("io.opentelemetry:opentelemetry-bom:${opentelemetryVersion}")
    api platform("io.zipkin.reporter2:zipkin-reporter-bom:${zipkinReporterVersion}")
    api platform("io.prometheus:simpleclient_bom:${prometheusClientVersion}")
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    // Define managed dependencies
    constraints {
        // Core libraries
        api "org.javassist:javassist:${javassistVersion}"
        api "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
        api "net.bytebuddy:byte-buddy-agent:${byteBuddyVersion}"
        api "org.jboss.netty:netty:${nettyVersion}"
        api "io.netty:netty-all:${netty4Version}"
        api "org.apache.httpcomponents:httpclient:${httpclientVersion}"
        api "org.apache.httpcomponents:httpcore:${httpcoreVersion}"
        api "com.alibaba:fastjson:${fastjsonVersion}"
        api "com.alibaba.fastjson2:fastjson2:${fastjson2Version}"
        
        // Zookeeper & Curator
        api "org.apache.zookeeper:zookeeper:${zookeeperVersion}"
        api "org.apache.curator:curator-framework:${curatorVersion}"
        api "org.apache.curator:curator-x-discovery:${curatorVersion}"
        api "org.apache.curator:curator-recipes:${curatorVersion}"
        
        // Serialization
        api "com.caucho:hessian:${hessianVersion}"
        api "org.apache.dubbo:hessian-lite:${hessianLiteVersion}"
        api "com.google.protobuf:protobuf-java:${protobufJavaVersion}"
        api "com.google.protobuf:protobuf-java-util:${protobufJavaVersion}"
        
        // Common utilities
        api "com.google.code.findbugs:jsr305:${jsr305Version}"
        api "javax.annotation:javax.annotation-api:${javaxAnnotationApiVersion}"
        api "javax.servlet:javax.servlet-api:${servletVersion}"
        api "jakarta.servlet:jakarta.servlet-api:${jakartaServletVersion}"
        api "jakarta.websocket:jakarta.websocket-api:${jakartaWebsocketVersion}"
        api "jakarta.websocket:jakarta.websocket-client-api:${jakartaWebsocketVersion}"
        api "com.squareup.okhttp3:okhttp:${okhttpVersion}"
        api "com.squareup.okhttp3:mockwebserver:${okhttpVersion}"
        
        // Jetty
        api "org.eclipse.jetty:jetty-server:${jettyVersion}"
        api "org.eclipse.jetty:jetty-servlet:${jettyVersion}"
        api "org.mortbay.jetty:jetty:${mortbayJettyVersion}"
        
        // Validation
        api "javax.validation:validation-api:${validationVersion}"
        api "org.hibernate:hibernate-validator:${hibernateValidatorVersion}"
        api "org.glassfish:javax.el:${jelVersion}"
        api "jakarta.validation:jakarta.validation-api:${validationNewVersion}"
        api "org.hibernate.validator:hibernate-validator:${hibernateValidatorNewVersion}"
        
        // Cache
        api "javax.cache:cache-api:${jcacheVersion}"
        
        // REST
        api "javax.ws.rs:javax.ws.rs-api:${rsApiVersion}"
        api "org.jboss.resteasy:resteasy-jaxrs:${resteasyVersion}"
        api "org.jboss.resteasy:resteasy-client:${resteasyVersion}"
        api "org.jboss.resteasy:resteasy-netty4:${resteasyVersion}"
        api "org.jboss.resteasy:resteasy-jdk-http:${resteasyVersion}"
        api "org.jboss.resteasy:resteasy-jackson-provider:${resteasyVersion}"
        api "org.jboss.resteasy:resteasy-jaxb-provider:${resteasyVersion}"
        
        // Jackson (Codehaus)
        api "org.codehaus.jackson:jackson-core-asl:${codehausJacksonVersion}"
        api "org.codehaus.jackson:jackson-mapper-asl:${codehausJacksonVersion}"
        api "org.codehaus.jackson:jackson-jaxrs:${codehausJacksonVersion}"
        api "org.codehaus.jackson:jackson-xc:${codehausJacksonVersion}"
        
        // Tomcat
        api "org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbedVersion}"
        api "org.apache.tomcat:tomcat-servlet-api:${tomcatServletApiVersion}"
        
        // Logging
        api "org.slf4j:slf4j-api:${slf4jVersion}"
        api "commons-logging:commons-logging:${jclVersion}"
        api "commons-io:commons-io:${commonsIoVersion}"
        api "commons-codec:commons-codec:${commonsCodecVersion}"
        api "log4j:log4j:${log4jVersion}"
        api "ch.qos.logback:logback-classic:${logbackVersion}"
        api "org.apache.logging.log4j:log4j-api:${log4j2Version}"
        api "org.apache.logging.log4j:log4j-core:${log4j2Version}"
        api "org.apache.logging.log4j:log4j-slf4j-impl:${log4j2Version}"
        api "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j2Version}"
        
        // Config center
        api "com.ctrip.framework.apollo:apollo-client:${apolloClientVersion}"
        api "org.yaml:snakeyaml:${snakeyamlVersion}"
        api "org.apache.commons:commons-lang3:${commonsLang3Version}"
        
        // Envoy
        api "io.envoyproxy.controlplane:api:${envoyApiVersion}"
        
        // Groovy
        api "org.apache.groovy:groovy:${groovyVersion}"
        
        // JAXB
        api "javax.xml.bind:jaxb-api:${jaxbVersion}"
        api "com.sun.xml.bind:jaxb-impl:${jaxbVersion}"
        api "com.sun.xml.bind:jaxb-core:${jaxbVersion}"
        api "javax.activation:javax.activation-api:${activationVersion}"
        api "com.sun.activation:javax.activation:${activationVersion}"
        
        // Swagger
        api "io.swagger:swagger-annotations:${swaggerVersion}"
        api "io.swagger:swagger-jaxrs:${swaggerVersion}"
        
        // Testing
        api "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
        api "org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}"
        api "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
        api "org.junit.platform:junit-platform-engine:${junitPlatformVersion}"
        api "org.junit.platform:junit-platform-commons:${junitPlatformVersion}"
        api "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
        api "org.awaitility:awaitility:${awaitilityVersion}"
        api "org.hamcrest:hamcrest:${hamcrestVersion}"
        api "org.mockito:mockito-core:${mockitoVersion}"
        api "org.mockito:mockito-inline:${mockitoVersion}"
        api "cglib:cglib-nodep:${cglibVersion}"
        api "org.spockframework:spock-core:${spockVersion}"
        api "org.spockframework:spock-spring:${spockVersion}"
        api "org.spockframework:spock-junit4:${spockVersion}"
        
        // JSON
        api "com.google.code.gson:gson:${gsonVersion}"
        api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
        api "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
        api "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
        api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
        
        // Others
        api "javax.portlet:portlet-api:${portletVersion}"
        api "org.testcontainers:testcontainers:${testContainerVersion}"
        
        // Nacos
        api "com.alibaba.nacos:nacos-client:${nacosVersion}"
        
        // Sentinel
        api "com.alibaba.csp:sentinel-apache-dubbo3-adapter:${sentinelVersion}"
        api "com.alibaba.csp:sentinel-transport-simple-http:${sentinelVersion}"
        
        // Seata
        api "io.seata:seata-spring-boot-starter:${seataVersion}"
        api "io.seata:seata-core:${seataVersion}"
        
        // gRPC
        api "io.grpc:grpc-core:${grpcVersion}"
        api "io.grpc:grpc-netty-shaded:${grpcVersion}"
        api "io.grpc:grpc-netty:${grpcVersion}"
        api "io.grpc:grpc-protobuf:${grpcVersion}"
        api "io.grpc:grpc-stub:${grpcVersion}"
        api "io.grpc:grpc-grpclb:${grpcVersion}"
        api "io.grpc:grpc-context:${grpcVersion}"
        api "com.salesforce.servicelibs:grpc-contrib:${grpcContribVersion}"
        api "com.salesforce.servicelibs:jprotoc:${jprotocVersion}"
        api "com.github.spullara.mustache.java:compiler:${mustacheVersion}"
        
        // Compression
        api "org.apache.commons:commons-compress:${commonsCompressVersion}"
        api "org.xerial.snappy:snappy-java:${snappyJavaVersion}"
        
        // Metrics
        api "com.tdunning:t-digest:${tDigestVersion}"
        api "io.prometheus:simpleclient:${prometheusClientVersion}"
        api "io.prometheus:simpleclient_pushgateway:${prometheusClientVersion}"
        // zipkin versions managed by zipkin-reporter-bom
        
        // Reactive
        api "org.reactivestreams:reactive-streams:${reactiveVersion}"
        api "io.projectreactor:reactor-core:${reactorVersion}"
        api "io.smallrye.reactive:mutiny:${mutinyVersion}"
        api "io.reactivex.rxjava2:rxjava:${rxjavaVersion}"
        
        // Jakarta XML Bind
        api "jakarta.xml.bind:jakarta.xml.bind-api:${jakartaXmlBindApiVersion}"
        api "org.glassfish.jaxb:jaxb-runtime:${jaxbRuntimeVersion}"
        
        // Security
        api "org.bouncycastle:bcprov-jdk18on:${bouncycastleBcprovVersion}"
        api "org.bouncycastle:bcpkix-jdk18on:${bouncycastleBcprovVersion}"
    }
}

// Publishing configuration is already defined in root build.gradle, no need to repeat

