plugins {
    id 'java-platform'
}

description = 'Dubbo dependencies BOM'

javaPlatform {
    allowDependencies()
}

dependencies {
    // Import platform BOMs
    api platform("org.springframework:spring-framework-bom:${libs.versions.spring.get()}")
    api platform("org.springframework.security:spring-security-bom:${libs.versions.springSecurity.get()}")
    api platform("io.netty:netty-bom:${libs.versions.netty4.get()}")
    api platform("io.micrometer:micrometer-bom:${libs.versions.micrometer.get()}")
    api platform("io.micrometer:micrometer-tracing-bom:${libs.versions.micrometerTracing.get()}")
    api platform("io.opentelemetry:opentelemetry-bom:${libs.versions.opentelemetry.get()}")
    api platform("io.zipkin.reporter2:zipkin-reporter-bom:${libs.versions.zipkinReporter.get()}")
    api platform("io.prometheus:simpleclient_bom:${libs.versions.prometheusClient.get()}")
    api platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}")

    // Define managed dependencies
    constraints {
        // Core libraries
        api "org.javassist:javassist:${libs.versions.javassist.get()}"
        api "net.bytebuddy:byte-buddy:${libs.versions.byteBuddy.get()}"
        api "net.bytebuddy:byte-buddy-agent:${libs.versions.byteBuddy.get()}"
        api "org.jboss.netty:netty:${libs.versions.netty.get()}"
        api "io.netty:netty-all:${libs.versions.netty4.get()}"
        api "org.apache.httpcomponents:httpclient:${libs.versions.httpclient.get()}"
        api "org.apache.httpcomponents:httpcore:${libs.versions.httpcore.get()}"
        api "com.alibaba:fastjson:${libs.versions.fastjson.get()}"
        api "com.alibaba.fastjson2:fastjson2:${libs.versions.fastjson2.get()}"
        
        // Zookeeper & Curator
        api "org.apache.zookeeper:zookeeper:${libs.versions.zookeeper.get()}"
        api "org.apache.curator:curator-framework:${libs.versions.curator.get()}"
        api "org.apache.curator:curator-x-discovery:${libs.versions.curator.get()}"
        api "org.apache.curator:curator-recipes:${libs.versions.curator.get()}"
        
        // Serialization
        api "com.caucho:hessian:${libs.versions.hessian.get()}"
        api "org.apache.dubbo:hessian-lite:${libs.versions.hessianLite.get()}"
        api "com.google.protobuf:protobuf-java:${libs.versions.protobufJava.get()}"
        api "com.google.protobuf:protobuf-java-util:${libs.versions.protobufJava.get()}"
        
        // Common utilities
        api "com.google.code.findbugs:jsr305:${libs.versions.jsr305.get()}"
        api "javax.annotation:javax.annotation-api:${libs.versions.javaxAnnotationApi.get()}"
        api "javax.servlet:javax.servlet-api:${libs.versions.servlet.get()}"
        api "jakarta.servlet:jakarta.servlet-api:${libs.versions.jakartaServlet.get()}"
        api "jakarta.websocket:jakarta.websocket-api:${libs.versions.jakartaWebsocket.get()}"
        api "jakarta.websocket:jakarta.websocket-client-api:${libs.versions.jakartaWebsocket.get()}"
        api "com.squareup.okhttp3:okhttp:${libs.versions.okhttp.get()}"
        api "com.squareup.okhttp3:mockwebserver:${libs.versions.okhttp.get()}"
        
        // Jetty
        api "org.eclipse.jetty:jetty-server:${libs.versions.jetty.get()}"
        api "org.eclipse.jetty:jetty-servlet:${libs.versions.jetty.get()}"
        api "org.mortbay.jetty:jetty:${libs.versions.mortbayJetty.get()}"
        
        // Validation
        api "javax.validation:validation-api:${libs.versions.validation.get()}"
        api "org.hibernate:hibernate-validator:${libs.versions.hibernateValidator.get()}"
        api "org.glassfish:javax.el:${libs.versions.jel.get()}"
        api "jakarta.validation:jakarta.validation-api:${libs.versions.validationNew.get()}"
        api "org.hibernate.validator:hibernate-validator:${libs.versions.hibernateValidatorNew.get()}"
        
        // Cache
        api "javax.cache:cache-api:${libs.versions.jcache.get()}"
        
        // REST
        api "javax.ws.rs:javax.ws.rs-api:${libs.versions.rsApi.get()}"
        api "org.jboss.resteasy:resteasy-jaxrs:${libs.versions.resteasy.get()}"
        api "org.jboss.resteasy:resteasy-client:${libs.versions.resteasy.get()}"
        api "org.jboss.resteasy:resteasy-netty4:${libs.versions.resteasy.get()}"
        api "org.jboss.resteasy:resteasy-jdk-http:${libs.versions.resteasy.get()}"
        api "org.jboss.resteasy:resteasy-jackson-provider:${libs.versions.resteasy.get()}"
        api "org.jboss.resteasy:resteasy-jaxb-provider:${libs.versions.resteasy.get()}"
        
        // Jackson (Codehaus)
        api "org.codehaus.jackson:jackson-core-asl:${libs.versions.codehausJackson.get()}"
        api "org.codehaus.jackson:jackson-mapper-asl:${libs.versions.codehausJackson.get()}"
        api "org.codehaus.jackson:jackson-jaxrs:${libs.versions.codehausJackson.get()}"
        api "org.codehaus.jackson:jackson-xc:${libs.versions.codehausJackson.get()}"
        
        // Tomcat
        api "org.apache.tomcat.embed:tomcat-embed-core:${libs.versions.tomcatEmbed.get()}"
        api "org.apache.tomcat:tomcat-servlet-api:${libs.versions.tomcatServletApi.get()}"
        
        // Logging
        api "org.slf4j:slf4j-api:${libs.versions.slf4j.get()}"
        api "commons-logging:commons-logging:${libs.versions.jcl.get()}"
        api "commons-io:commons-io:${libs.versions.commonsIo.get()}"
        api "commons-codec:commons-codec:${libs.versions.commonsCodec.get()}"
        api "log4j:log4j:${libs.versions.log4j.get()}"
        api "ch.qos.logback:logback-classic:${libs.versions.logback.get()}"
        api "org.apache.logging.log4j:log4j-api:${libs.versions.log4j2.get()}"
        api "org.apache.logging.log4j:log4j-core:${libs.versions.log4j2.get()}"
        api "org.apache.logging.log4j:log4j-slf4j-impl:${libs.versions.log4j2.get()}"
        api "org.apache.logging.log4j:log4j-slf4j2-impl:${libs.versions.log4j2.get()}"
        
        // Config center
        api "com.ctrip.framework.apollo:apollo-client:${libs.versions.apolloClient.get()}"
        api "org.yaml:snakeyaml:${libs.versions.snakeyaml.get()}"
        api "org.apache.commons:commons-lang3:${libs.versions.commonsLang3.get()}"
        
        // Envoy
        api "io.envoyproxy.controlplane:api:${libs.versions.envoyApi.get()}"
        
        // Groovy
        api "org.apache.groovy:groovy:${libs.versions.groovy.get()}"
        
        // JAXB
        api "javax.xml.bind:jaxb-api:${libs.versions.jaxb.get()}"
        api "com.sun.xml.bind:jaxb-impl:${libs.versions.jaxb.get()}"
        api "com.sun.xml.bind:jaxb-core:${libs.versions.jaxb.get()}"
        api "javax.activation:javax.activation-api:${libs.versions.activation.get()}"
        api "com.sun.activation:javax.activation:${libs.versions.activation.get()}"
        
        // Swagger
        api "io.swagger:swagger-annotations:${libs.versions.swagger.get()}"
        api "io.swagger:swagger-jaxrs:${libs.versions.swagger.get()}"
        
        // Testing
        api "org.junit.jupiter:junit-jupiter-engine:${libs.versions.junitJupiter.get()}"
        api "org.junit.jupiter:junit-jupiter-api:${libs.versions.junitJupiter.get()}"
        api "org.junit.jupiter:junit-jupiter-params:${libs.versions.junitJupiter.get()}"
        api "org.junit.platform:junit-platform-engine:${libs.versions.junitPlatform.get()}"
        api "org.junit.platform:junit-platform-commons:${libs.versions.junitPlatform.get()}"
        api "org.junit.platform:junit-platform-launcher:${libs.versions.junitPlatform.get()}"
        api "org.awaitility:awaitility:${libs.versions.awaitility.get()}"
        api "org.hamcrest:hamcrest:${libs.versions.hamcrest.get()}"
        api "org.mockito:mockito-core:${libs.versions.mockito.get()}"
        api "org.mockito:mockito-inline:${libs.versions.mockito.get()}"
        api "cglib:cglib-nodep:${libs.versions.cglib.get()}"
        api "org.spockframework:spock-core:${libs.versions.spock.get()}"
        api "org.spockframework:spock-spring:${libs.versions.spock.get()}"
        api "org.spockframework:spock-junit4:${libs.versions.spock.get()}"
        
        // JSON
        api "com.google.code.gson:gson:${libs.versions.gson.get()}"
        api "com.fasterxml.jackson.core:jackson-databind:${libs.versions.jackson.get()}"
        api "com.fasterxml.jackson.core:jackson-annotations:${libs.versions.jackson.get()}"
        api "com.fasterxml.jackson.core:jackson-core:${libs.versions.jackson.get()}"
        api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${libs.versions.jackson.get()}"
        
        // Others
        api "javax.portlet:portlet-api:${libs.versions.portlet.get()}"
        api "org.testcontainers:testcontainers:${libs.versions.testcontainers.get()}"
        
        // Nacos
        api "com.alibaba.nacos:nacos-client:${libs.versions.nacos.get()}"
        
        // Sentinel
        api "com.alibaba.csp:sentinel-apache-dubbo3-adapter:${libs.versions.sentinel.get()}"
        api "com.alibaba.csp:sentinel-transport-simple-http:${libs.versions.sentinel.get()}"
        
        // Seata
        api "io.seata:seata-spring-boot-starter:${libs.versions.seata.get()}"
        api "io.seata:seata-core:${libs.versions.seata.get()}"
        
        // gRPC
        api "io.grpc:grpc-core:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-netty-shaded:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-netty:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-protobuf:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-stub:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-grpclb:${libs.versions.grpc.get()}"
        api "io.grpc:grpc-context:${libs.versions.grpc.get()}"
        api "com.salesforce.servicelibs:grpc-contrib:${libs.versions.grpcContrib.get()}"
        api "com.salesforce.servicelibs:jprotoc:${libs.versions.jprotoc.get()}"
        api "com.github.spullara.mustache.java:compiler:${libs.versions.mustache.get()}"
        
        // Compression
        api "org.apache.commons:commons-compress:${libs.versions.commonsCompress.get()}"
        api "org.xerial.snappy:snappy-java:${libs.versions.snappyJava.get()}"
        
        // Metrics
        api "com.tdunning:t-digest:${libs.versions.digest.get()}"
        api "io.prometheus:simpleclient:${libs.versions.prometheusClient.get()}"
        api "io.prometheus:simpleclient_pushgateway:${libs.versions.prometheusClient.get()}"
        // zipkin versions managed by zipkin-reporter-bom
        
        // Reactive
        api "org.reactivestreams:reactive-streams:${libs.versions.reactive.get()}"
        api "io.projectreactor:reactor-core:${libs.versions.reactor.get()}"
        api "io.smallrye.reactive:mutiny:${libs.versions.mutiny.get()}"
        api "io.reactivex.rxjava2:rxjava:${libs.versions.rxjava.get()}"
        
        // Jakarta XML Bind
        api "jakarta.xml.bind:jakarta.xml.bind-api:${libs.versions.jakartaXmlBindApi.get()}"
        api "org.glassfish.jaxb:jaxb-runtime:${libs.versions.jaxbRuntime.get()}"
        
        // Security
        api "org.bouncycastle:bcprov-jdk18on:${libs.versions.bouncycastleBcprov.get()}"
        api "org.bouncycastle:bcpkix-jdk18on:${libs.versions.bouncycastleBcprov.get()}"
    }
}

// Publishing configuration is already defined in root build.gradle, no need to repeat

