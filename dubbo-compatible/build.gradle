description = 'The compatible module of dubbo project'

dependencies {
    api project(':dubbo-common')
    api project(':dubbo-config:dubbo-config-spring')
    api project(':dubbo-plugin:dubbo-qos')
    api project(':dubbo-remoting:dubbo-remoting-zookeeper-curator5')
    api project(':dubbo-plugin:dubbo-filter-cache')
    api project(':dubbo-plugin:dubbo-filter-validation')
    api project(':dubbo-serialization:dubbo-serialization-hessian2')
    api project(':dubbo-serialization:dubbo-serialization-fastjson2')
    api project(':dubbo-registry:dubbo-registry-multicast')
    api project(':dubbo-registry:dubbo-registry-zookeeper')
    api project(':dubbo-configcenter:dubbo-configcenter-zookeeper')
    api project(':dubbo-metadata:dubbo-metadata-processor')
    api project(':dubbo-metadata:dubbo-metadata-report-zookeeper')
    
    // Add compile-time dependencies
    compileOnly "javax.servlet:javax.servlet-api"
    compileOnly "org.springframework:spring-core"
    compileOnly "log4j:log4j:1.2.17"  // for LogPageHandler compatibility
    
    testImplementation "org.apache.logging.log4j:log4j-slf4j-impl"

    // Complete missing dependencies
    compileOnly "javax.ws.rs:javax.ws.rs-api"
}


