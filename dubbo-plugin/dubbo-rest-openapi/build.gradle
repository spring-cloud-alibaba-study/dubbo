description = 'The dubbo-parent module of dubbo project'

dependencies {
    api project(':dubbo-rpc:dubbo-rpc-triple')
    implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsV3Version}"
    implementation "org.webjars:swagger-ui:${swaggerUiVersion}"
    implementation "org.webjars:redoc:${redocVersion}"
    implementation "org.webjars:webjars-locator-lite:${webjarsLocatorLiteVersion}"
    implementation "com.github.therapi:therapi-runtime-javadoc:${therapiRuntimeJavadocVersion}"
    testImplementation "org.spockframework:spock-core"
}
