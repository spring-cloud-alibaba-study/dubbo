plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

description = 'Dubbo Gradle IDL Plugin - Generate Dubbo service stubs from IDL files'

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    
    // Protobuf support
    implementation libs.protobufJava
    compileOnly libs.protobufJavaUtil
    
    // Dubbo compiler integration (runtime dependency for protoc plugin)
    implementation project(':dubbo-plugin:dubbo-compiler')
    
    // gRPC support (optional)
    compileOnly libs.grpcCore
    compileOnly libs.grpcProtobuf
    compileOnly libs.grpcStub
    
    testImplementation libs.junitJupiterApi
    testImplementation libs.junitJupiterEngine
}

// Gradle Plugin Configuration
gradlePlugin {
    plugins {
        dubboIdl {
            id = 'org.apache.dubbo.idl'
            implementationClass = 'org.apache.dubbo.gradle.idl.DubboIdlPlugin'
            displayName = 'Dubbo IDL Plugin'
            description = 'Generate Dubbo service stubs from Protocol Buffers IDL files'
        }
    }
}

